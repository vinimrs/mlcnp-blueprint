apiVersion: v1
kind: ConfigMap
metadata:
  name: mlcnp-gateway
  labels:
    app.kubernetes.io/component: gateway
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      add_header X-MLCNP-Gateway "modsecurity-crs" always;

      location /application/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://mlcnp-application:8081/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlcnp-gateway
  labels:
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mlcnp
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mlcnp
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-nginx-config
          image: owasp/modsecurity-crs:4.25.1-nginx-alpine-202608131208@sha256:8f0abbe80160c8e074d48991b2d6fd6e485f8fe28630d3575fe2965c4d53faf8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: nginx-runtime
              mountPath: /work
            - name: modsecurity-runtime
              mountPath: /modsecurity
            - name: crs-runtime
              mountPath: /crs
          command:
            - /bin/sh
            - -ec
            - >-
              cp -R /etc/nginx/. /work/ &&
              cp -R /etc/modsecurity.d/. /modsecurity/ &&
              cp -R /opt/owasp-crs/. /crs/
      containers:
        - name: gateway
          image: owasp/modsecurity-crs:4.25.1-nginx-alpine-202608131208@sha256:8f0abbe80160c8e074d48991b2d6fd6e485f8fe28630d3575fe2965c4d53faf8
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: SERVER_NAME
              value: _
            - name: MODSEC_RULE_ENGINE
              value: "On"
            - name: MODSEC_REQ_BODY_ACCESS
              value: "On"
            - name: MODSEC_RESP_BODY_ACCESS
              value: "Off"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          volumeMounts:
            - name: nginx-runtime
              mountPath: /etc/nginx
            - name: modsecurity-runtime
              mountPath: /etc/modsecurity.d
            - name: crs-runtime
              mountPath: /opt/owasp-crs
            - name: config
              mountPath: /etc/nginx/templates/conf.d/default.conf.template
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-runtime
          emptyDir: {}
        - name: modsecurity-runtime
          emptyDir: {}
        - name: crs-runtime
          emptyDir: {}
        - name: config
          configMap:
            name: mlcnp-gateway
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlcnp-gateway
  labels:
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: mlcnp
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
