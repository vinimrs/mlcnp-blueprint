apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlcnp-blueprint
resources:
  - namespace.yaml
  - gateway.yaml
  - workload.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/name: mlcnp
      app.kubernetes.io/instance: mlcnp
      app.kubernetes.io/managed-by: kubectl
      app.kubernetes.io/part-of: mlcnp
images:
  - name: mlcnp/java-openrasp-demo
    newName: mlcnp/java-openrasp-demo
    newTag: local
