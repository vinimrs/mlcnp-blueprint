apiVersion: v1
kind: ConfigMap
metadata:
  name: mlcnp-application-proxy
  labels:
    app.kubernetes.io/component: sidecar-proxy
    app.kubernetes.io/workload: application
data:
  default.conf: |
    server {
      listen 8081;
      server_tokens off;
      client_max_body_size 1m;
      client_body_timeout 10s;
      keepalive_timeout 30s;
      add_header X-MLCNP-Sidecar "nginx" always;
      add_header X-MLCNP-Sidecar-Policy "baseline-v1" always;
      add_header X-Content-Type-Options "nosniff" always;

      location / {
        limit_except GET HEAD POST PUT PATCH DELETE OPTIONS {
          deny all;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
        proxy_pass http://127.0.0.1:8080;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlcnp-application
  labels:
    app.kubernetes.io/component: protected-workload
    app.kubernetes.io/workload: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mlcnp
      app.kubernetes.io/component: protected-workload
      app.kubernetes.io/workload: application
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mlcnp
        app.kubernetes.io/component: protected-workload
        app.kubernetes.io/workload: application
        mlcnp.io/runtime-provider: openrasp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application-with-rasp
          image: mlcnp/java-openrasp-demo
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED -javaagent:/opt/rasp/rasp.jar"
          ports:
            - name: app
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: app
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: app
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: app
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: rasp-logs
              mountPath: /opt/rasp/logs
            - name: tomcat-logs
              mountPath: /usr/local/tomcat/logs
            - name: tomcat-temp
              mountPath: /usr/local/tomcat/temp
            - name: tomcat-work
              mountPath: /usr/local/tomcat/work
            - name: tomcat-context
              mountPath: /usr/local/tomcat/conf/Catalina
        - name: sidecar-proxy
          image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 96Mi
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: proxy-config
          configMap:
            name: mlcnp-application-proxy
        - name: rasp-logs
          emptyDir: {}
        - name: tomcat-logs
          emptyDir: {}
        - name: tomcat-temp
          emptyDir: {}
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-context
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlcnp-application
  labels:
    app.kubernetes.io/component: workload-service
    app.kubernetes.io/workload: application
spec:
  selector:
    app.kubernetes.io/instance: mlcnp
    app.kubernetes.io/component: protected-workload
    app.kubernetes.io/workload: application
  ports:
    - name: http-sidecar
      port: 8081
      targetPort: proxy
